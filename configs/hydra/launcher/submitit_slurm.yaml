# conf/hydra/launcher/submitit_slurm.yaml
_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher


# SLURM resources
partition: gpu-pre
account: mtdlOp
nodes: 1
tasks_per_node: 1
cpus_per_task: 20
mem_gb: 20
timeout_min: 320  # 10 days = 14400 minutes

# SLURM extras
name: ${hydra.job.name}
submitit_folder: run_batch/HPClogs/.submitit/%j
array_parallelism: 16

# Optional extras
gres: gpu:1
setup:
  - cd /home/clusterusers/tborsani/NLBSE2026
  - module purge
  - module load python/3.10.8-gcc-12.1.0-linux-ubuntu22.04-zen2
  - module load cuda/11.8
  - source /data/users/tborsani/NLBSE2026/myenv/bin/activate
  - export PYTHONPATH=$(pwd)

