# @package _global_
_target_: src.pipeline.pipeline
defaults:
  - /component/augment: SyntheticData
  - /component/finetune: ModernBERT
  - /component/classifier: setfit

trainer:
  SYNQ: 0.1
  ValidationSize: 0.2

component:
  augment:
    augments: 1
    ntop: 10

  finetune:
    batch_size: 64
    learning_rate: 2e-5
    weight_decay: 0.01
    mlm_probability: 0.15

  classifier:
    batch_size: 32
    num_iterations: 20

